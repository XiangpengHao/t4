name: Fuzz

on:
  schedule:
    # Mondays at 10:00 UTC: 2 AM Pacific, 3 AM in summer.
    - cron: "0 10 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NIX_CONFIG: accept-flake-config = true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cache_equivalence
          - target: frames
          - target: log_base
          # Its owner and clients run on shuttle (`fuzz/README.md`).
          - target: shared_owner
            rustflags: --cfg t4_simulated
          # Scripts long from the start: a short one shares little.
          - target: shared_mode
            rustflags: --cfg t4_simulated
            options: -len_control=0 -max_len=1024
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build
        run: nix develop -c cargo fuzz build ${{ matrix.target }}

      # One process: a restart first runs its whole corpus again, which in time
      # takes all of a short run.
      - name: Fuzz for an hour
        env:
          TMPDIR: /dev/shm
        run: >-
          nix develop -c cargo fuzz run ${{ matrix.target }} --
          -max_total_time=3600 -timeout=10 -rss_limit_mb=8192 ${{ matrix.options }}

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # The PR gate runs two fixed seeds; this runs fresh ones, eight times the iterations. A seed is
  # drawn here, never in the tests, so a failure names the seed that replays it.
  shuttle-fresh-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build
        run: nix develop -c cargo test --locked --features shuttle --lib --no-run

      # A run of the suite takes minutes at this budget: room for the last to finish.
      - name: Every shuttle test on fresh seeds for 50 minutes
        run: |
          nix develop -c bash -c '
            end=$((SECONDS + 3000))
            while [ "$SECONDS" -lt "$end" ]; do
              seed=0x$(od -An -N8 -tx8 /dev/urandom | tr -d " ")
              echo "T4_SHUTTLE_SEED=$seed"
              if ! T4_SHUTTLE_SEED=$seed T4_SHUTTLE_BUDGET=8 \
                cargo test --locked --features shuttle --lib; then
                echo "::error::shuttle failed on T4_SHUTTLE_SEED=$seed T4_SHUTTLE_BUDGET=8"
                exit 1
              fi
            done'
