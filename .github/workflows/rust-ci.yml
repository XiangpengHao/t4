name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NIX_CONFIG: accept-flake-config = true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Check formatting
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.fmt

      - name: Run Clippy
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.clippy

      - name: Run tests
        timeout-minutes: 15
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.tests

      - name: Run proof check
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.proofs

      - name: Run shuttle tests
        timeout-minutes: 15
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.shuttle

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Run Clippy
        run: nix build --no-link --print-build-logs .#checks.aarch64-darwin.clippy

      - name: Run tests
        timeout-minutes: 15
        run: nix build --no-link --print-build-logs .#checks.aarch64-darwin.tests

      - name: Run proof check
        run: nix build --no-link --print-build-logs .#checks.aarch64-darwin.proofs
