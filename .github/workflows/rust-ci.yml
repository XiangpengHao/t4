name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NIX_CONFIG: accept-flake-config = true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Prepare CI environment
        run: nix develop .#ci -c rustc -vV

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop .#ci -c {0}
          # Include Verus and its compiler as well as the nightly rustc identity
          # detected by rust-cache. All checks write beneath target/.
          key: ${{ hashFiles('flake.nix', 'flake.lock') }}
          cache-bin: false

      - name: Check formatting
        run: nix develop .#ci -c cargo fmt --all -- --check

      - name: Run Clippy
        run: nix develop .#ci -c cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        timeout-minutes: 15
        run: nix develop .#ci -c cargo test

      - name: Run proof check
        run: nix develop .#ci -c cargo verus focus

      - name: Run shuttle tests
        timeout-minutes: 15
        run: nix develop .#ci -c cargo test --features shuttle shuttle

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Prepare CI environment
        run: nix develop .#ci -c rustc -vV

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop .#ci -c {0}
          # Include Verus and its compiler as well as the nightly rustc identity
          # detected by rust-cache. All checks write beneath target/.
          key: ${{ hashFiles('flake.nix', 'flake.lock') }}
          cache-bin: false

      - name: Run Clippy
        run: nix develop .#ci -c cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        timeout-minutes: 15
        run: nix develop .#ci -c cargo test

      - name: Run proof check
        run: nix develop .#ci -c cargo verus focus
