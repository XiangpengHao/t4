name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NIX_CONFIG: accept-flake-config = true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Check formatting
        run: nix build -L .#fmt

      - name: Run Clippy
        run: nix build -L .#clippy

      - name: Run tests
        timeout-minutes: 15
        run: nix build -L .#tests

      - name: Run proof check
        run: nix build -L .#proofs

      - name: Run shuttle tests
        timeout-minutes: 15
        run: nix build -L .#shuttle

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Run Clippy
        run: nix build -L .#clippy

      - name: Run tests
        timeout-minutes: 15
        run: nix build -L .#tests

      - name: Run proof check
        run: nix build -L .#proofs
